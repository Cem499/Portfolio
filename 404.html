<!DOCTYPE html>
<html lang="de-CH">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden, Sin Digital</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/assets/ICON-Logo_Sin-Digital.webp">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: #050505;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .error-container {
            max-width: 520px;
        }

        .error-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            color: #C1FF72;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: inline-block;
            padding: 0.85rem 2rem;
            background: #C1FF72;
            color: #050505;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 0.03em;
            transition: opacity 0.2s;
        }

        .btn-home:hover {
            opacity: 0.85;
        }

        .logo {
            margin-bottom: 2.5rem;
        }

        .logo img {
            height: 36px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="logo">
            <a href="/" title="Sin Digital, Startseite">
                <img src="/assets/Logo_Sin-Digital.webp" alt="Sin Digital Logo" width="160" height="44" fetchpriority="high" loading="eager">
            </a>
        </div>
        <div class="error-code">404</div>
        <h1>Seite nicht gefunden</h1>
        <p>Die gewünschte Seite existiert leider nicht oder wurde verschoben. Kehren Sie zur Startseite zurück, um mehr
            über Sin Digital zu erfahren.</p>
        <a href="/" class="btn-home">Zur Startseite</a>
    </div>
</body>

</html>
